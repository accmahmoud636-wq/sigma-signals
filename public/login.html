<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MILLIONAIRE · تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#060810;display:flex;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.08) 0%,transparent 60%)}
.particles{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.p{position:absolute;width:1px;height:1px;background:rgba(212,175,55,.4);border-radius:50%;animation:float linear infinite}
@keyframes float{from{transform:translateY(100vh)}to{transform:translateY(-100px)}}
.card{position:relative;width:100%;max-width:420px;margin:20px;background:rgba(10,13,20,.95);border:1px solid rgba(212,175,55,.2);border-radius:16px;padding:40px;box-shadow:0 0 60px rgba(212,175,55,.05),0 20px 60px rgba(0,0,0,.5)}
.logo-wrap{text-align:center;margin-bottom:32px}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#d4af37,#f5d070);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;box-shadow:0 0 30px rgba(212,175,55,.3)}
.logo-name{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:#d4af37;letter-spacing:3px}
.logo-sub{font-size:12px;color:#445566;margin-top:4px;letter-spacing:.05em}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;color:#7d8590;margin-bottom:6px;letter-spacing:.05em}
.form-input{width:100%;background:#0d1117;border:1px solid #1c2733;border-radius:8px;padding:12px 14px;color:#e6edf3;font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 3px rgba(212,175,55,.05)}
.form-input::placeholder{color:#445566}
.btn-login{width:100%;background:linear-gradient(135deg,#d4af37,#b8962e);border:none;border-radius:8px;padding:13px;color:#000;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;letter-spacing:.05em}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(212,175,55,.3)}
.btn-login:active{transform:translateY(0)}
.error-msg{background:rgba(218,54,51,.1);border:1px solid rgba(218,54,51,.3);border-radius:6px;padding:10px 14px;color:#ff6b6b;font-size:13px;margin-top:12px;display:none}
.footer-note{text-align:center;font-size:11px;color:#2a3a4a;margin-top:24px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">💰</div>
    <div class="logo-name">MILLIONAIRE</div>
    <div class="logo-sub">منصة إشارات التداول الاحترافية</div><div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d4af37;opacity:.6;margin-top:4px;letter-spacing:.05em">by Mahmoud Ahmed</div>
  </div>

  <div class="form-group">
    <label class="form-label">اسم المستخدم</label>
    <input class="form-input" id="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username">
  </div>
  <div class="form-group">
    <label class="form-label">كلمة المرور</label>
    <input class="form-input" id="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btn-login" onclick="login()">دخول</button>
  <div class="error-msg" id="error-msg"></div>
  <div class="footer-note">© 2026 MILLIONAIRE · جميع الحقوق محفوظة</div>
</div>

<script>
// Particles
const p = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const d = document.createElement('div');
  d.className = 'p';
  d.style.cssText = `left:${Math.random()*100}%;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;animation-duration:${Math.random()*15+10}s;animation-delay:-${Math.random()*20}s`;
  p.appendChild(d);
}

// Check if already logged in
const token = localStorage.getItem('mm_token');
if (token) window.location.href = '/';

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl    = document.getElementById('error-msg');
  const btn      = document.getElementById('btn-login');

  if (!username || !password) { showError('أدخل اسم المستخدم وكلمة المرور'); return; }

  btn.textContent = 'جاري الدخول...';
  btn.disabled = true;
  errEl.style.display = 'none';

  try {
    const res  = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'خطأ في تسجيل الدخول'); return; }
    localStorage.setItem('mm_token', data.token);
    localStorage.setItem('mm_name', data.name);
    localStorage.setItem('mm_role', data.role);
    window.location.href = data.role === 'admin' ? '/admin' : '/';
  } catch(e) {
    showError('تعذر الاتصال بالسيرفر');
  } finally {
    btn.textContent = 'دخول';
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
