<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MILLIONAIRE · إشارات التداول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810;--bg2:#0a0d14;--bg3:#0d1117;--card:#0f1521;
  --border:rgba(212,175,55,.12);--border2:rgba(212,175,55,.2);
  --gold:#d4af37;--gold2:#f5d070;--gold3:rgba(212,175,55,.08);
  --green:#00d97e;--red:#ff4d4d;--blue:#4da6ff;--yellow:#f0b429;
  --text:#d0dce8;--muted:#445566;--muted2:#607080;
  --mono:'IBM Plex Mono',monospace;--ar:'Tajawal',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--ar);min-height:100vh}

/* ── HEADER ── */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-text{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--gold);letter-spacing:2px}
.hstats{display:flex;gap:1px;margin-right:auto;flex-wrap:wrap}
.hs{padding:0 12px;height:56px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--border)}
.hs-n{font-family:var(--mono);font-size:15px;font-weight:600}
.hs-l{font-size:10px;color:var(--muted2);margin-top:1px}
.mkt{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px}
.mkt-open{color:var(--green);background:rgba(0,217,126,.08);border:1px solid rgba(0,217,126,.2)}
.mkt-closed{color:var(--muted2);background:var(--bg3);border:1px solid var(--border)}
.user-wrap{display:flex;align-items:center;gap:8px}
.user-name{font-size:12px;color:var(--muted2);font-family:var(--mono)}
.btn-sm{background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:4px 10px;border-radius:5px;cursor:pointer;font-family:var(--ar);font-size:11px;transition:all .15s}
.btn-sm:hover{border-color:var(--red);color:var(--red)}

/* ── TABS ── */
.tabs{padding:12px 20px;display:flex;gap:6px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;align-items:center}
.tab{padding:6px 16px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-family:var(--ar);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold)}
.tab .cnt{background:var(--bg3);padding:1px 6px;border-radius:10px;font-family:var(--mono);font-size:10px}
.tab.active .cnt{background:rgba(212,175,55,.15)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;margin-left:auto}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── GRID ── */
.wrap{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.empty{text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.3;display:block}
.empty-txt{font-size:14px}
.empty-sub{font-size:12px;color:var(--muted);margin-top:6px}

/* ── CARD ── */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;transition:transform .18s,box-shadow .18s;cursor:default}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.card.new-card{animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card-bar{height:3px}
.bar-buy{background:linear-gradient(90deg,var(--green),transparent)}
.bar-sell{background:linear-gradient(90deg,var(--red),transparent)}
.card-head{padding:14px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between}
.card-sym{font-family:var(--mono);font-size:20px;font-weight:600;color:#fff}
.dir-badge{padding:4px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:600}
.dir-buy{background:rgba(0,217,126,.12);color:var(--green);border:1px solid rgba(0,217,126,.25)}
.dir-sell{background:rgba(255,77,77,.12);color:var(--red);border:1px solid rgba(255,77,77,.25)}
.card-price{padding:2px 16px 12px;display:flex;align-items:baseline;gap:8px}
.price-val{font-family:var(--mono);font-size:24px;font-weight:600;color:#fff}
.price-lbl{font-size:11px;color:var(--muted2)}
.levels{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lv{background:var(--bg3);border-radius:7px;padding:7px 8px;border:1px solid rgba(28,39,51,.9)}
.lv-lbl{font-size:9px;color:var(--muted2);margin-bottom:3px}
.lv-val{font-family:var(--mono);font-size:12px;font-weight:500}
.lv-tp{color:var(--green)}.lv-sl{color:var(--red)}.lv-pct{color:var(--yellow)}
.rr-wrap{margin:0 16px 12px}
.rr-top{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-bottom:4px}
.rr-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.rr-fill{height:100%;border-radius:2px}
.card-foot{padding:10px 16px;border-top:1px solid rgba(28,39,51,.7);display:flex;align-items:center;justify-content:space-between}
.status-chip{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.s-open{background:rgba(0,217,126,.08);color:var(--green);border:1px solid rgba(0,217,126,.2)}
.s-stopped{background:rgba(255,77,77,.08);color:var(--red);border:1px solid rgba(255,77,77,.2)}
.s-target{background:rgba(240,180,41,.08);color:var(--yellow);border:1px solid rgba(240,180,41,.2)}
.s-dot{width:5px;height:5px;border-radius:50%}
.s-open .s-dot{background:var(--green);animation:pulse 2s infinite}
.s-stopped .s-dot,.s-target .s-dot{background:currentColor}
.card-meta{text-align:left}
.card-strat{font-size:10px;color:var(--muted2)}
.card-time{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── WEBHOOK BAR ── */
.wh-bar{background:var(--bg2);border-top:1px solid var(--border);padding:6px 20px;display:flex;align-items:center;gap:10px;font-size:11px;flex-wrap:wrap}
.wh-label{color:var(--muted2)}
.wh-url{font-family:var(--mono);color:var(--blue);cursor:pointer;background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:4px}
.wh-url:hover{border-color:var(--blue)}

@media(max-width:600px){.grid{grid-template-columns:1fr}.hstats{display:none}}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <div class="logo-icon">💰</div>
    <div><div class="logo-text">MILLIONAIRE</div><div style="font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:.05em">by Mahmoud Ahmed</div></div>
  </a>
  <div class="hstats">
    <div class="hs"><div class="hs-n" id="h-open" style="color:var(--green)">0</div><div class="hs-l">مفتوحة</div></div>
    <div class="hs"><div class="hs-n" id="h-target" style="color:var(--yellow)">0</div><div class="hs-l">حققت الهدف</div></div>
    <div class="hs"><div class="hs-n" id="h-stopped" style="color:var(--red)">0</div><div class="hs-l">وقف الخسارة</div></div>
    <div class="hs"><div class="hs-n" id="h-total">0</div><div class="hs-l">الكل</div></div>
  </div>
  <div class="mkt mkt-closed" id="mkt"></div>
  <div class="user-wrap">
    <span class="user-name" id="uname"></span>
    <button class="btn-sm" onclick="logout()">خروج</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="setTab('all',this)">الكل <span class="cnt" id="c-all">0</span></button>
  <button class="tab" onclick="setTab('open',this)">🟢 مفتوحة <span class="cnt" id="c-open">0</span></button>
  <button class="tab" onclick="setTab('target',this)">🎯 الهدف <span class="cnt" id="c-target">0</span></button>
  <button class="tab" onclick="setTab('stopped',this)">🛑 وقف الخسارة <span class="cnt" id="c-stopped">0</span></button>
  <button class="tab" onclick="setTab('BUY',this)">▲ شراء <span class="cnt" id="c-buy">0</span></button>
  <button class="tab" onclick="setTab('SELL',this)">▼ بيع <span class="cnt" id="c-sell">0</span></button>
  <span class="live-dot"></span>
</div>

<div class="wrap"><div class="grid" id="grid"></div></div>

<div class="wh-bar">
  <span class="wh-label">Webhook URL:</span>
  <span class="wh-url" onclick="copyWH()" id="wh-url-text">جاري التحميل...</span>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Auth Check ──────────────────────────────────
const token = localStorage.getItem('mm_token');
if (!token) window.location.href = '/login.html';
document.getElementById('uname').textContent = localStorage.getItem('mm_name') || '';
document.getElementById('wh-url-text').textContent = location.origin + '/webhook';

// ── State ───────────────────────────────────────
let signals  = [];
let tab      = 'all';
let lastSeen = 0;

// ── Market Status ───────────────────────────────
function updateMkt() {
  const ny = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d=ny.getDay(),h=ny.getHours(),m=ny.getMinutes();
  const open = d>=1&&d<=5&&(h>9||(h===9&&m>=30))&&h<16;
  const el = document.getElementById('mkt');
  el.textContent = open ? '● السوق مفتوح' : '○ السوق مغلق';
  el.className = 'mkt '+(open?'mkt-open':'mkt-closed');
}
setInterval(updateMkt,30000); updateMkt();

// ── Load Signals ────────────────────────────────
async function load() {
  try {
    const r = await fetch('/api/signals',{headers:{'x-auth-token':token}});
    if(r.status===401||r.status===403){logout();return;}
    const data = await r.json();
    if(!Array.isArray(data)) return;
    // إشارات جديدة
    if(data.length > lastSeen && lastSeen > 0) {
      const n = data.length - lastSeen;
      showToast(`📡 ${n} إشارة جديدة!`);
    }
    lastSeen = data.length;
    signals  = data;
    render();
  } catch(e){}
}
load();
setInterval(load, 5000);

// ── Render ──────────────────────────────────────
function render() {
  const open    = signals.filter(s=>s.status==='open').length;
  const target  = signals.filter(s=>s.status==='target').length;
  const stopped = signals.filter(s=>s.status==='stopped').length;
  const buys    = signals.filter(s=>s.action==='BUY').length;
  const sells   = signals.filter(s=>s.action==='SELL').length;

  document.getElementById('h-open').textContent    = open;
  document.getElementById('h-target').textContent  = target;
  document.getElementById('h-stopped').textContent = stopped;
  document.getElementById('h-total').textContent   = signals.length;
  document.getElementById('c-all').textContent     = signals.length;
  document.getElementById('c-open').textContent    = open;
  document.getElementById('c-target').textContent  = target;
  document.getElementById('c-stopped').textContent = stopped;
  document.getElementById('c-buy').textContent     = buys;
  document.getElementById('c-sell').textContent    = sells;

  let list = [...signals];
  if(tab==='open')    list=list.filter(s=>s.status==='open');
  else if(tab==='target')  list=list.filter(s=>s.status==='target');
  else if(tab==='stopped') list=list.filter(s=>s.status==='stopped');
  else if(tab==='BUY')  list=list.filter(s=>s.action==='BUY');
  else if(tab==='SELL') list=list.filter(s=>s.action==='SELL');

  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML=`<div class="empty"><span class="empty-icon">📡</span><div class="empty-txt">لا توجد إشارات</div><div class="empty-sub">في انتظار إشارات TradingView...</div></div>`;
    return;
  }

  grid.innerHTML = list.map(s => {
    const isBuy  = s.action==='BUY';
    const entry  = parseFloat(s.price)||0;
    let   tp     = parseFloat(s.tp)||0;
    const sl     = parseFloat(s.sl)||0;
    const slDist = Math.abs(entry-sl);
    if(!tp||Math.abs(tp-entry)<0.00001) tp = isBuy ? entry+slDist*2 : entry-slDist*2;
    const reward = Math.abs(tp-entry);
    const tpPct  = entry>0 ? (isBuy?(tp-entry)/entry*100:(entry-tp)/entry*100).toFixed(2) : '0.00';
    const rr     = slDist>0 ? (reward/slDist).toFixed(1) : '—';
    const rrPct  = slDist>0 ? Math.min(reward/(slDist+reward)*100,100).toFixed(0) : 50;
    const rrClr  = parseFloat(rr)>=2?'var(--green)':parseFloat(rr)>=1.5?'var(--yellow)':'var(--red)';
    const dp     = entry>=100?2:4;
    const stMap  = {open:{cls:'s-open',txt:'● مفتوحة'},stopped:{cls:'s-stopped',txt:'🛑 وقف الخسارة'},target:{cls:'s-target',txt:'🎯 حقق الهدف'}};
    const st     = stMap[s.status]||stMap.open;
    const dt     = new Date(s.receivedAt).toLocaleString('ar',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});

    return `<div class="card new-card">
      <div class="card-bar ${isBuy?'bar-buy':'bar-sell'}"></div>
      <div class="card-head">
        <div class="card-sym">${s.symbol}</div>
        <span class="dir-badge ${isBuy?'dir-buy':'dir-sell'}">${isBuy?'▲ شراء':'▼ بيع'}</span>
      </div>
      <div class="card-price">
        <span class="price-val">$${entry.toFixed(dp)}</span>
        <span class="price-lbl">سعر الدخول</span>
      </div>
      <div class="levels">
        <div class="lv"><div class="lv-lbl">🎯 الهدف</div><div class="lv-val lv-tp">$${tp.toFixed(dp)}</div></div>
        <div class="lv"><div class="lv-lbl">📈 نسبة</div><div class="lv-val lv-pct">+${tpPct}%</div></div>
        <div class="lv"><div class="lv-lbl">🛑 وقف</div><div class="lv-val lv-sl">$${sl.toFixed(dp)}</div></div>
      </div>
      <div class="rr-wrap">
        <div class="rr-top"><span>المخاطرة / المكافأة</span><span style="color:${rrClr};font-family:var(--mono)">1 : ${rr}</span></div>
        <div class="rr-track"><div class="rr-fill" style="width:${rrPct}%;background:${rrClr}"></div></div>
      </div>
      <div class="card-foot">
        <div class="status-chip ${st.cls}"><div class="s-dot"></div>${st.txt}</div>
        <div class="card-meta">
          <div class="card-strat">⚡ ${s.strategy||'TradingView'}</div>
          <div class="card-time">${dt}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setTab(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function copyWH(){
  navigator.clipboard?.writeText(location.origin+'/webhook');
  showToast('تم نسخ الـ Webhook URL ✓');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

async function logout(){
  try{await fetch('/api/logout',{method:'POST',headers:{'x-auth-token':token}});}catch(e){}
  localStorage.clear(); window.location.href='/login.html';
}
</script>
</body>
</html>
