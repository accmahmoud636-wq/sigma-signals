<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MILLIONAIRE · إشارات التداول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810;--bg2:#0a0d14;--bg3:#0d1117;--card:#0f1521;
  --border:rgba(212,175,55,.12);--border2:rgba(212,175,55,.2);
  --gold:#d4af37;--gold2:#f5d070;--gold3:rgba(212,175,55,.08);
  --green:#00d97e;--red:#ff4d4d;--blue:#4da6ff;--yellow:#f0b429;
  --text:#d0dce8;--muted:#445566;--muted2:#607080;
  --mono:'IBM Plex Mono',monospace;--ar:'Tajawal',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--ar);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--gold);letter-spacing:2px}
.logo-by{font-family:var(--mono);font-size:9px;color:var(--muted2)}
.hstats{display:flex;gap:1px;margin-right:auto}
.hs{padding:0 12px;height:52px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--border)}
.hs-n{font-family:var(--mono);font-size:15px;font-weight:600}
.hs-l{font-size:9px;color:var(--muted2);margin-top:1px}
.mkt{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:4px}
.mkt-open{color:var(--green);background:rgba(0,217,126,.08);border:1px solid rgba(0,217,126,.2)}
.mkt-closed{color:var(--muted2);background:var(--bg3);border:1px solid var(--border)}
.user-wrap{display:flex;align-items:center;gap:8px}
.uname{font-size:11px;color:var(--muted2);font-family:var(--mono)}
.btn-sm{background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:3px 10px;border-radius:5px;cursor:pointer;font-family:var(--ar);font-size:11px;transition:all .15s}
.btn-sm:hover{border-color:var(--red);color:var(--red)}

/* ── TABS ── */
.tabs{padding:8px 20px;display:flex;gap:6px;border-bottom:1px solid var(--border);background:var(--bg2);align-items:center;flex-wrap:wrap;flex-shrink:0}
.tab{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-family:var(--ar);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold)}
.cnt{background:var(--bg3);padding:1px 6px;border-radius:10px;font-family:var(--mono);font-size:10px}
.tab.active .cnt{background:rgba(212,175,55,.15)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;margin-right:auto}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── REPORT ── */
.report{padding:10px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;border-bottom:1px solid var(--border);background:var(--bg2);}
.rcard{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:8px 12px}
.rcard-val{font-family:var(--mono);font-size:18px;font-weight:600;margin-bottom:2px}
.rcard-lbl{font-size:11px;color:var(--muted2)}
.rcard-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.winrate-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.winrate-fill{height:100%;border-radius:2px;background:var(--green);transition:width .5s}

/* ── TABLE ── */
.wrap{padding:16px 20px;overflow:auto;flex:1}
.signals-table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
.signals-table thead th{padding:8px 12px;color:var(--muted2);font-weight:400;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-align:right;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:1;white-space:nowrap}
.signals-table tbody td{padding:9px 12px;border-bottom:1px solid rgba(212,175,55,.04);text-align:right;vertical-align:middle}
.signals-table tbody tr{transition:background .1s}
.signals-table tbody tr:hover td{background:rgba(212,175,55,.03)}
.signals-table tbody tr.new-row{animation:rowIn .3s ease}
@keyframes rowIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

/* ── TABLE CELLS ── */
.sym-cell{display:flex;align-items:center;gap:8px}
.sym-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);flex-shrink:0}
.sym-icon.buy{background:rgba(0,217,126,.12);color:var(--green);border:1px solid rgba(0,217,126,.2)}
.sym-icon.sell{background:rgba(255,77,77,.12);color:var(--red);border:1px solid rgba(255,77,77,.2)}
.sym-name{font-family:var(--mono);font-size:13px;font-weight:500;color:#fff}
.dir-txt{font-family:var(--mono);font-size:11px;font-weight:600}
.dir-buy{color:var(--green)}
.dir-sell{color:var(--red)}
.price-cell{font-family:var(--mono);font-size:12px}
.current-up{color:var(--green)}
.current-dn{color:var(--red)}
.current-neutral{color:var(--muted2)}
.tp-cell{color:var(--green);font-family:var(--mono);font-size:12px}
.sl-cell{color:var(--red);font-family:var(--mono);font-size:12px}
.pct-cell{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--yellow)}

/* Progress bar in table */
.prog-wrap{display:flex;align-items:center;gap:6px;min-width:100px}
.prog-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .5s}
.prog-pct{font-family:var(--mono);font-size:10px;color:var(--muted2);width:30px;text-align:left}

/* Status */
.status-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500;white-space:nowrap}
.s-open{background:rgba(0,217,126,.08);color:var(--green);border:1px solid rgba(0,217,126,.15)}
.s-stopped{background:rgba(255,77,77,.08);color:var(--red);border:1px solid rgba(255,77,77,.15)}
.s-target{background:rgba(240,180,41,.08);color:var(--yellow);border:1px solid rgba(240,180,41,.15)}
.s-dot{width:4px;height:4px;border-radius:50%}
.s-open .s-dot{background:var(--green);animation:pulse 2s infinite}
.s-stopped .s-dot{background:var(--red)}
.s-target .s-dot{background:var(--yellow)}

.strat-cell{font-size:10px;color:var(--muted2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time-cell{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}

/* Empty */
.empty-row td{text-align:center;padding:60px;color:var(--muted)}
.empty-icon{font-size:36px;display:block;margin-bottom:10px;opacity:.3}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* WH bar */
.wh-bar{background:var(--bg2);border-top:1px solid var(--border);padding:6px 20px;display:flex;align-items:center;gap:10px;font-size:11px;flex-shrink:0}
.wh-lbl{color:var(--muted2)}
.wh-url{font-family:var(--mono);color:var(--blue);cursor:pointer;background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:4px}

@media(max-width:768px){.hstats{display:none}.report{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">💰</div>
    <div>
      <div class="logo-text">MILLIONAIRE</div>
      <div class="logo-by">by Mahmoud Ahmed</div>
    </div>
  </div>
  <div class="hstats">
    <div class="hs"><div class="hs-n" id="h-open" style="color:var(--green)">0</div><div class="hs-l">مفتوحة</div></div>
    <div class="hs"><div class="hs-n" id="h-target" style="color:var(--yellow)">0</div><div class="hs-l">حققت الهدف</div></div>
    <div class="hs"><div class="hs-n" id="h-stopped" style="color:var(--red)">0</div><div class="hs-l">وقف الخسارة</div></div>
    <div class="hs"><div class="hs-n" id="h-wr" style="color:var(--gold)">—</div><div class="hs-l">Win Rate</div></div>
  </div>
  <div class="mkt mkt-closed" id="mkt"></div>
  <div class="user-wrap">
    <span class="uname" id="uname"></span>
    <button class="btn-sm" onclick="logout()">خروج</button>
  </div>
</header>

<!-- REPORT -->
<div class="report" id="report">
  <div class="rcard">
    <div class="rcard-val" id="r-total" style="color:var(--blue)">0</div>
    <div class="rcard-lbl">إجمالي الإشارات</div>
  </div>
  <div class="rcard">
    <div class="rcard-val" id="r-win" style="color:var(--green)">0</div>
    <div class="rcard-lbl">صفقات رابحة ✅</div>
    <div class="rcard-sub" id="r-win-pct">—</div>
  </div>
  <div class="rcard">
    <div class="rcard-val" id="r-loss" style="color:var(--red)">0</div>
    <div class="rcard-lbl">صفقات خاسرة ❌</div>
    <div class="rcard-sub" id="r-loss-pct">—</div>
  </div>
  <div class="rcard">
    <div class="rcard-val" id="r-open" style="color:var(--muted2)">0</div>
    <div class="rcard-lbl">مفتوحة الآن 🟢</div>
  </div>
  <div class="rcard">
    <div class="rcard-val" id="r-wr" style="color:var(--gold)">—</div>
    <div class="rcard-lbl">نسبة النجاح</div>
    <div class="winrate-bar"><div class="winrate-fill" id="r-wr-bar" style="width:0%"></div></div>
  </div>
  <div class="rcard">
    <div class="rcard-val" id="r-best" style="color:var(--green);font-size:14px">—</div>
    <div class="rcard-lbl">أفضل استراتيجية</div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="setTab('all',this)">الكل <span class="cnt" id="c-all">0</span></button>
  <button class="tab" onclick="setTab('open',this)">🟢 مفتوحة <span class="cnt" id="c-open">0</span></button>
  <button class="tab" onclick="setTab('target',this)">🎯 الهدف <span class="cnt" id="c-target">0</span></button>
  <button class="tab" onclick="setTab('stopped',this)">🛑 وقف الخسارة <span class="cnt" id="c-stopped">0</span></button>
  <button class="tab" onclick="setTab('BUY',this)">▲ شراء <span class="cnt" id="c-buy">0</span></button>
  <button class="tab" onclick="setTab('SELL',this)">▼ بيع <span class="cnt" id="c-sell">0</span></button>
  <span class="live-dot"></span>
</div>

<!-- TABLE -->
<div class="wrap">
  <table class="signals-table">
    <thead>
      <tr>
        <th>السهم</th>
        <th>اتجاه</th>
        <th>سعر الدخول</th>
        <th>السعر الحالي</th>
        <th>الهدف</th>
        <th>وقف الخسارة</th>
        <th>نسبة الهدف</th>
        <th>التقدم</th>
        <th>الحالة</th>
        <th>الاستراتيجية</th>
        <th>الوقت</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="wh-bar">
  <span class="wh-lbl">Webhook:</span>
  <span class="wh-url" onclick="copyWH()" id="wh-url"></span>
</div>

<div class="toast" id="toast"></div>

<script>
const token = localStorage.getItem('mm_token');
if (!token) window.location.href = '/login.html';
document.getElementById('uname').textContent  = localStorage.getItem('mm_name') || '';
document.getElementById('wh-url').textContent = location.origin + '/webhook';

let signals = [], tab = 'all', lastSeen = 0;
const priceCache = {};

// ── Market ──────────────────────────────────────
function updateMkt() {
  const ny = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d=ny.getDay(),h=ny.getHours(),m=ny.getMinutes();
  const open = d>=1&&d<=5&&(h>9||(h===9&&m>=30))&&h<16;
  const el = document.getElementById('mkt');
  el.textContent = open ? '● مفتوح' : '○ مغلق';
  el.className = 'mkt '+(open?'mkt-open':'mkt-closed');
}
setInterval(updateMkt,60000); updateMkt();

// ── Load Signals ────────────────────────────────
async function load() {
  try {
    const r = await fetch('/api/signals',{headers:{'x-auth-token':token}});
    if(r.status===401||r.status===403){logout();return;}
    const data = await r.json();
    if(!Array.isArray(data)) return;
    if(data.length > lastSeen && lastSeen > 0) showToast('📡 إشارة جديدة!');
    lastSeen = data.length;
    signals  = data;
    render();
    updateReport();
  } catch(e){}
}
load();
setInterval(load, 5000);

// ── Report ──────────────────────────────────────
function updateReport() {
  const open    = signals.filter(s=>s.status==='open').length;
  const target  = signals.filter(s=>s.status==='target').length;
  const stopped = signals.filter(s=>s.status==='stopped').length;
  const closed  = target + stopped;
  const wr      = closed > 0 ? (target/closed*100).toFixed(1) : null;

  // أفضل استراتيجية
  const stratMap = {};
  signals.filter(s=>s.status==='target').forEach(s=>{
    stratMap[s.strategy] = (stratMap[s.strategy]||0) + 1;
  });
  const bestStrat = Object.keys(stratMap).sort((a,b)=>stratMap[b]-stratMap[a])[0] || '—';

  document.getElementById('r-total').textContent   = signals.length;
  document.getElementById('r-win').textContent     = target;
  document.getElementById('r-loss').textContent    = stopped;
  document.getElementById('r-open').textContent    = open;
  document.getElementById('r-win-pct').textContent = closed>0 ? (target/closed*100).toFixed(1)+'% من المغلقة' : '—';
  document.getElementById('r-loss-pct').textContent= closed>0 ? (stopped/closed*100).toFixed(1)+'% من المغلقة' : '—';
  document.getElementById('r-wr').textContent      = wr ? wr+'%' : '—';
  document.getElementById('r-wr-bar').style.width  = (wr||0)+'%';
  document.getElementById('r-wr-bar').style.background = parseFloat(wr)>=60?'var(--green)':parseFloat(wr)>=40?'var(--yellow)':'var(--red)';
  document.getElementById('r-best').textContent    = bestStrat;
  document.getElementById('h-open').textContent    = open;
  document.getElementById('h-target').textContent  = target;
  document.getElementById('h-stopped').textContent = stopped;
  document.getElementById('h-wr').textContent      = wr ? wr+'%' : '—';
}

// ── Render Table ────────────────────────────────
function render() {
  let list = [...signals];
  if(tab==='open')    list=list.filter(s=>s.status==='open');
  else if(tab==='target')  list=list.filter(s=>s.status==='target');
  else if(tab==='stopped') list=list.filter(s=>s.status==='stopped');
  else if(tab==='BUY')  list=list.filter(s=>s.action==='BUY');
  else if(tab==='SELL') list=list.filter(s=>s.action==='SELL');

  const counts = {
    all:signals.length,
    open:signals.filter(s=>s.status==='open').length,
    target:signals.filter(s=>s.status==='target').length,
    stopped:signals.filter(s=>s.status==='stopped').length,
    BUY:signals.filter(s=>s.action==='BUY').length,
    SELL:signals.filter(s=>s.action==='SELL').length
  };
  ['all','open','target','stopped','BUY','SELL'].forEach(k=>{
    const el = document.getElementById('c-'+k);
    if(el) el.textContent = counts[k]||0;
  });

  const tbody = document.getElementById('tbody');
  if(!list.length){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="11"><span class="empty-icon">📡</span>لا توجد إشارات — في انتظار TradingView...</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(s => {
    const isBuy  = s.action==='BUY';
    const entry  = parseFloat(s.price)||0;
    let   tp     = parseFloat(s.tp)||0;
    const sl     = parseFloat(s.sl)||0;
    const slDist = Math.abs(entry-sl);
    if(!tp||Math.abs(tp-entry)<0.00001) tp = isBuy?entry+slDist*2:entry-slDist*2;
    const tpPct  = entry>0?(isBuy?(tp-entry)/entry*100:(entry-tp)/entry*100).toFixed(2):'0.00';
    const dp     = entry>=100?2:4;

    // السعر الحالي من الكاش
    const cur    = priceCache[s.symbol.toUpperCase()];
    const isProfit = cur ? (isBuy?cur>entry:cur<entry) : null;
    const chgPct = cur&&entry>0?((cur-entry)/entry*100).toFixed(2):null;
    const curText = cur ? '$'+cur.toFixed(dp) : '—';
    const curClass = isProfit===null?'current-neutral':isProfit?'current-up':'current-dn';
    const chgText  = chgPct ? (chgPct>=0?'+':'')+chgPct+'%' : '';

    // شريط التقدم
    let progPct = 0;
    if(cur && s.status==='open') {
      const reward = Math.abs(tp-entry);
      const moved  = isBuy?Math.max(0,cur-entry):Math.max(0,entry-cur);
      progPct = reward>0?Math.min(100,(moved/reward*100)):0;
    } else if(s.status==='target') progPct=100;
    const progClr = progPct>=75?'var(--green)':progPct>=40?'var(--yellow)':'var(--blue)';

    const stMap = {open:{cls:'s-open',txt:'● مفتوحة'},stopped:{cls:'s-stopped',txt:'🛑 وقف الخسارة'},target:{cls:'s-target',txt:'🎯 الهدف'}};
    const st = stMap[s.status]||stMap.open;
    const dt = new Date(s.receivedAt).toLocaleString('ar',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});

    return `<tr id="row-${s._id||s.id}" class="new-row">
      <td>
        <div class="sym-cell">
          <div class="sym-icon ${isBuy?'buy':'sell'}">${s.symbol.replace('USDT','').slice(0,3)}</div>
          <span class="sym-name">${s.symbol}</span>
        </div>
      </td>
      <td><span class="dir-txt ${isBuy?'dir-buy':'dir-sell'}">${isBuy?'▲ شراء':'▼ بيع'}</span></td>
      <td class="price-cell">$${entry.toFixed(dp)}</td>
      <td class="price-cell ${curClass}">${curText} <small style="opacity:.7">${chgText}</small></td>
      <td class="tp-cell">$${tp.toFixed(dp)}</td>
      <td class="sl-cell">$${sl.toFixed(dp)}</td>
      <td class="pct-cell">+${tpPct}%</td>
      <td>
        <div class="prog-wrap">
          <div class="prog-track"><div class="prog-fill" style="width:${progPct.toFixed(0)}%;background:${progClr}"></div></div>
          <span class="prog-pct" style="color:${progClr}">${progPct.toFixed(0)}%</span>
        </div>
      </td>
      <td><span class="status-chip ${st.cls}"><span class="s-dot"></span>${st.txt}</span></td>
      <td class="strat-cell" title="${s.strategy||''}">${s.strategy||'—'}</td>
      <td class="time-cell">${dt}</td>
    </tr>`;
  }).join('');
}

function setTab(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── Price Monitor (Binance) ─────────────────────
const updatedIds = new Set();

async function checkPrices() {
  const openSigs = signals.filter(s=>s.status==='open');
  if(!openSigs.length) return;
  const syms = [...new Set(openSigs.map(s=>s.symbol.toUpperCase()))];
  try {
    const url = 'https://api.binance.com/api/v3/ticker/price?symbols=['+syms.map(s=>'"'+s+'"').join(',')+']';
    const res  = await fetch(url);
    if(!res.ok) return;
    const prices = await res.json();
    prices.forEach(p=>{ priceCache[p.symbol]=parseFloat(p.price); });

    for(const sig of openSigs) {
      const price = priceCache[sig.symbol.toUpperCase()];
      if(!price||updatedIds.has(sig._id||sig.id)) continue;
      const isBuy = sig.action==='BUY';
      let   tp    = parseFloat(sig.tp)||0;
      const sl    = parseFloat(sig.sl)||0;
      const entry = parseFloat(sig.price)||0;
      const slD   = Math.abs(entry-sl);
      if(!tp||Math.abs(tp-entry)<0.00001) tp = isBuy?entry+slD*2:entry-slD*2;
      let newStatus = null;
      if(isBuy){ if(price>=tp) newStatus='target'; else if(price<=sl) newStatus='stopped'; }
      else     { if(price<=tp) newStatus='target'; else if(price>=sl) newStatus='stopped'; }
      if(newStatus) {
        updatedIds.add(sig._id||sig.id);
        await updateSignal(sig._id||sig.id, newStatus, price);
        showToast(newStatus==='target'?'🎯 '+sig.symbol+' حقق الهدف!':'🛑 '+sig.symbol+' وقف الخسارة');
      }
    }
    render();
  } catch(e){}
}

async function updateSignal(id,status,closePrice) {
  try {
    await fetch('/api/signals/'+id,{method:'PUT',headers:{'Content-Type':'application/json','x-auth-token':token},body:JSON.stringify({status,closePrice})});
    const sig = signals.find(s=>(s._id||s.id)===id);
    if(sig){sig.status=status;sig.closePrice=closePrice;}
    render(); updateReport();
  } catch(e){}
}

setInterval(checkPrices,15000);
setTimeout(checkPrices,3000);

function copyWH(){
  navigator.clipboard?.writeText(location.origin+'/webhook');
  showToast('تم نسخ الـ Webhook URL ✓');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

async function logout(){
  try{await fetch('/api/logout',{method:'POST',headers:{'x-auth-token':token}});}catch(e){}
  localStorage.clear(); window.location.href='/login.html';
}
