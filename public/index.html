<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MILLIONAIRE · إشارات التداول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810;--bg2:#0a0d14;--bg3:#0d1117;--card:#0f1521;
  --border:rgba(212,175,55,.12);--border2:rgba(212,175,55,.2);
  --gold:#d4af37;--gold2:#f5d070;--gold3:rgba(212,175,55,.08);
  --green:#00d97e;--red:#ff4d4d;--blue:#4da6ff;
  --text:#d0dce8;--muted:#445566;--muted2:#607080;
  --mono:'IBM Plex Mono',monospace;--ar:'Tajawal',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--ar);min-height:100vh}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--gold);letter-spacing:2px}
.header-stats{display:flex;gap:1px;margin-right:auto}
.hstat{padding:0 14px;height:56px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--border);cursor:default}
.hstat-n{font-family:var(--mono);font-size:16px;font-weight:600}
.hstat-l{font-size:10px;color:var(--muted2);margin-top:1px}
.user-info{display:flex;align-items:center;gap:10px}
.user-name{font-size:13px;color:var(--muted2)}
.btn-logout{background:transparent;border:1px solid var(--border2);color:var(--muted2);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:var(--ar);font-size:12px;transition:all .15s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
.mkt{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px}
.mkt-open{color:var(--green);background:rgba(0,217,126,.08);border:1px solid rgba(0,217,126,.2)}
.mkt-closed{color:var(--muted2);background:var(--bg3);border:1px solid var(--border)}

/* TABS */
.tabs{padding:14px 20px;display:flex;gap:6px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap}
.tab{padding:7px 18px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-family:var(--ar);font-size:13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.active{background:var(--gold3);border-color:var(--gold);color:var(--gold)}
.tab .count{background:var(--bg3);padding:1px 7px;border-radius:10px;font-family:var(--mono);font-size:11px}
.tab.active .count{background:rgba(212,175,55,.15)}

/* GRID */
.content{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.empty{text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-text{font-size:15px}
.empty-sub{font-size:12px;color:var(--muted);margin-top:6px}

/* CARD */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card.new{animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card-top-bar{height:3px}
.bar-buy{background:linear-gradient(90deg,var(--green),rgba(0,217,126,.2))}
.bar-sell{background:linear-gradient(90deg,var(--red),rgba(255,77,77,.2))}
.card-head{padding:14px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between}
.card-sym{font-family:var(--mono);font-size:20px;font-weight:600;color:#fff}
.card-name{font-size:11px;color:var(--muted2);margin-top:2px}
.dir-badge{padding:4px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:600}
.dir-buy{background:rgba(0,217,126,.12);color:var(--green);border:1px solid rgba(0,217,126,.25)}
.dir-sell{background:rgba(255,77,77,.12);color:var(--red);border:1px solid rgba(255,77,77,.25)}
.card-price{padding:0 16px 12px;font-family:var(--mono);font-size:26px;font-weight:600;color:#fff}
.card-price-label{font-size:11px;color:var(--muted2);font-family:var(--ar);font-weight:400;margin-right:6px}
.levels{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lv{background:var(--bg3);border-radius:7px;padding:7px 8px;border:1px solid rgba(28,39,51,.8)}
.lv-label{font-size:9px;color:var(--muted2);margin-bottom:2px}
.lv-val{font-family:var(--mono);font-size:12px;font-weight:500}
.lv-tp{color:var(--green)}.lv-sl{color:var(--red)}.lv-pct{color:var(--gold)}
.rr-wrap{margin:0 16px 12px}
.rr-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-bottom:4px}
.rr-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.rr-fill{height:100%;border-radius:2px}
.card-foot{padding:10px 16px;border-top:1px solid rgba(28,39,51,.7);display:flex;align-items:center;justify-content:space-between}
.status-chip{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.s-open{background:rgba(0,217,126,.08);color:var(--green);border:1px solid rgba(0,217,126,.2)}
.s-stopped{background:rgba(255,77,77,.08);color:var(--red);border:1px solid rgba(255,77,77,.2)}
.s-target{background:rgba(212,175,55,.08);color:var(--gold);border:1px solid rgba(212,175,55,.2)}
.s-dot{width:5px;height:5px;border-radius:50%}
.s-open .s-dot{background:var(--green);animation:pulse 2s infinite}
.s-stopped .s-dot{background:var(--red)}
.s-target .s-dot{background:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card-strat{font-size:10px;color:var(--muted2)}
.card-time{font-family:var(--mono);font-size:9px;color:var(--muted)}

@media(max-width:600px){.grid{grid-template-columns:1fr}.hstat{padding:0 10px}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">💰</div>
    <div class="logo-text">MILLIONAIRE</div>
  </div>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-n" id="h-open" style="color:var(--green)">0</div>
      <div class="hstat-l">مفتوحة</div>
    </div>
    <div class="hstat">
      <div class="hstat-n" id="h-target" style="color:var(--gold)">0</div>
      <div class="hstat-l">حققت الهدف</div>
    </div>
    <div class="hstat">
      <div class="hstat-n" id="h-stopped" style="color:var(--red)">0</div>
      <div class="hstat-l">وقف الخسارة</div>
    </div>
  </div>
  <div class="mkt mkt-closed" id="mkt-badge">○ السوق</div>
  <div class="user-info">
    <span class="user-name" id="user-name">—</span>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="setTab('all',this)">الكل <span class="count" id="cnt-all">0</span></button>
  <button class="tab" onclick="setTab('open',this)">🟢 مفتوحة <span class="count" id="cnt-open">0</span></button>
  <button class="tab" onclick="setTab('target',this)">🎯 حققت الهدف <span class="count" id="cnt-target">0</span></button>
  <button class="tab" onclick="setTab('stopped',this)">🛑 وقف الخسارة <span class="count" id="cnt-stopped">0</span></button>
  <button class="tab" onclick="setTab('BUY',this)">▲ شراء <span class="count" id="cnt-buy">0</span></button>
  <button class="tab" onclick="setTab('SELL',this)">▼ بيع <span class="count" id="cnt-sell">0</span></button>
</div>

<div class="content">
  <div class="grid" id="grid"></div>
</div>

<script>
const token = localStorage.getItem('mm_token');
if (!token) window.location.href = '/login.html';

document.getElementById('user-name').textContent = localStorage.getItem('mm_name') || '';

let signals = [];
let currentTab = 'all';

// ── Market Status ──────────────────────────────
function updateMkt() {
  const ny = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d=ny.getDay(), h=ny.getHours(), m=ny.getMinutes();
  const open = d>=1&&d<=5&&(h>9||(h===9&&m>=30))&&h<16;
  const el = document.getElementById('mkt-badge');
  el.textContent = open ? '● السوق مفتوح' : '○ السوق مغلق';
  el.className = 'mkt ' + (open ? 'mkt-open' : 'mkt-closed');
}
setInterval(updateMkt, 60000); updateMkt();

// ── Fetch Signals ──────────────────────────────
async function loadSignals() {
  try {
    const res = await fetch('/api/signals', { headers: {'x-auth-token': token} });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const data = await res.json();
    if (Array.isArray(data)) { signals = data; render(); }
  } catch(e) {}
}

loadSignals();
setInterval(loadSignals, 5000);

// ── Render ─────────────────────────────────────
function render() {
  let list = [...signals];
  if (currentTab === 'open')    list = list.filter(s => s.status === 'open');
  else if (currentTab === 'target')  list = list.filter(s => s.status === 'target');
  else if (currentTab === 'stopped') list = list.filter(s => s.status === 'stopped');
  else if (currentTab === 'BUY')  list = list.filter(s => s.action === 'BUY');
  else if (currentTab === 'SELL') list = list.filter(s => s.action === 'SELL');

  // Counts
  const open    = signals.filter(s=>s.status==='open').length;
  const target  = signals.filter(s=>s.status==='target').length;
  const stopped = signals.filter(s=>s.status==='stopped').length;
  const buys    = signals.filter(s=>s.action==='BUY').length;
  const sells   = signals.filter(s=>s.action==='SELL').length;

  document.getElementById('h-open').textContent    = open;
  document.getElementById('h-target').textContent  = target;
  document.getElementById('h-stopped').textContent = stopped;
  document.getElementById('cnt-all').textContent     = signals.length;
  document.getElementById('cnt-open').textContent    = open;
  document.getElementById('cnt-target').textContent  = target;
  document.getElementById('cnt-stopped').textContent = stopped;
  document.getElementById('cnt-buy').textContent     = buys;
  document.getElementById('cnt-sell').textContent    = sells;

  const grid = document.getElementById('grid');
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📡</div><div class="empty-text">لا توجد إشارات</div><div class="empty-sub">في انتظار إشارات TradingView...</div></div>`;
    return;
  }

  grid.innerHTML = list.map(s => {
    const isBuy  = s.action === 'BUY';
    const entry  = s.price;
    const sl     = s.sl;
    const tp     = s.tp;
    const tpPct  = isBuy ? ((tp-entry)/entry*100).toFixed(2) : ((entry-tp)/entry*100).toFixed(2);
    const slDist = Math.abs(entry-sl);
    const reward = Math.abs(tp-entry);
    const rr     = slDist > 0 ? (reward/slDist).toFixed(1) : '—';
    const rrPct  = slDist > 0 ? Math.min(reward/(slDist+reward)*100, 100).toFixed(0) : 50;
    const rrColor = parseFloat(rr) >= 2 ? 'var(--green)' : parseFloat(rr) >= 1.5 ? 'var(--gold)' : 'var(--red)';

    const statusMap = {
      open:    {cls:'s-open',    txt:'مفتوحة ●'},
      stopped: {cls:'s-stopped', txt:'🛑 وقف الخسارة'},
      target:  {cls:'s-target',  txt:'🎯 حقق الهدف'},
    };
    const st = statusMap[s.status] || statusMap.open;

    const time = new Date(s.receivedAt).toLocaleString('ar',{
      month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true
    });

    return `<div class="card">
      <div class="card-top-bar ${isBuy?'bar-buy':'bar-sell'}"></div>
      <div class="card-head">
        <div>
          <div class="card-sym">${s.symbol}</div>
        </div>
        <span class="dir-badge ${isBuy?'dir-buy':'dir-sell'}">${isBuy?'▲ شراء':'▼ بيع'}</span>
      </div>
      <div class="card-price">$${entry.toFixed(entry>100?2:4)}<span class="card-price-label">سعر الدخول</span></div>
      <div class="levels">
        <div class="lv"><div class="lv-label">🎯 الهدف</div><div class="lv-val lv-tp">$${tp.toFixed(tp>100?2:4)}</div></div>
        <div class="lv"><div class="lv-label">📈 نسبة</div><div class="lv-val lv-pct">+${tpPct}%</div></div>
        <div class="lv"><div class="lv-label">🛑 وقف</div><div class="lv-val lv-sl">$${sl.toFixed(sl>100?2:4)}</div></div>
      </div>
      <div class="rr-wrap">
        <div class="rr-label"><span>المخاطرة/المكافأة</span><span style="color:${rrColor};font-family:var(--mono)">1 : ${rr}</span></div>
        <div class="rr-track"><div class="rr-fill" style="width:${rrPct}%;background:${rrColor}"></div></div>
      </div>
      <div class="card-foot">
        <div class="status-chip ${st.cls}"><div class="s-dot"></div>${st.txt}</div>
        <div style="text-align:left">
          <div class="card-strat">⚡ ${s.strategy}</div>
          <div class="card-time">${time}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function logout() {
  try { await fetch('/api/logout', { method:'POST', headers:{'x-auth-token':token} }); } catch(e) {}
  localStorage.clear();
  window.location.href = '/login.html';
}
</script>
</body>
</html>
